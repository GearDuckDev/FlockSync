name: Package or publish CurseForge addon

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing combined release tag to package (for example v0.4.0-beta)
        required: true
        type: string
      publish:
        description: Upload to CurseForge project 1756960 (otherwise preview only)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: curseforge-main-addon
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release and read addon version
        id: addon
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          AUTOMATIC: ${{ github.event_name == 'release' }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?$ ]]; then
            echo "::error::Use vX.Y.Z, vX.Y.Z-beta, or vX.Y.Z-alpha (optional .N preview suffix). Stable releases have no -release suffix."
            exit 1
          fi
          cp .github/curseforge.pkgmeta "$RUNNER_TEMP/flocksync-curseforge.pkgmeta"
          git checkout --detach "refs/tags/$RELEASE_TAG"
          version=$(sed -n 's/^## Version: //p' apps/addon/FlockSync/FlockSync.toc | tr -d '\r')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?$ ]]; then
            echo "::error::The main addon TOC must contain one supported version."
            exit 1
          fi
          channel() {
            case "$1" in
              *-alpha*) echo alpha ;;
              *-beta*) echo beta ;;
              *) echo release ;;
            esac
          }
          if [[ "$(channel "$version")" != "$(channel "$RELEASE_TAG")" ]]; then
            echo "::error::Tag and addon must use the same release channel for BigWigs publishing."
            exit 1
          fi
          release_type=$(channel "$RELEASE_TAG")
          if [[ "$AUTOMATIC" == "true" ]]; then
            expected_prerelease=true
            [[ "$release_type" == "release" ]] && expected_prerelease=false
            if [[ "$PRERELEASE" != "$expected_prerelease" ]]; then
              echo "::error::Alpha/beta tags must be GitHub pre-releases; stable tags must not be pre-releases."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Main addon: $version; bundle: $RELEASE_TAG; CurseForge type: $release_type" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip unchanged main addon on automatic releases
        id: eligibility
        uses: actions/github-script@v7
        env:
          ADDON_VERSION: ${{ steps.addon.outputs.version }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        with:
          script: |
            if (context.eventName !== "release") {
              core.setOutput("package", "true");
              return;
            }
            const releases = github.paginate.iterator(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100
            });
            for await (const { data } of releases) {
              for (const release of data) {
                if (release.draft || release.tag_name === process.env.RELEASE_TAG ||
                    !/^v\d+\.\d+\.\d+(?:-(?:alpha|beta)(?:\.\d+)?)?$/.test(release.tag_name) ||
                    Date.parse(release.published_at) >= Date.parse(context.payload.release.published_at)) continue;
                const result = await exec.getExecOutput("git", [
                  "show", `refs/tags/${release.tag_name}:apps/addon/FlockSync/FlockSync.toc`
                ], { silent: true });
                const version = result.stdout.match(/^## Version: (.+)\r?$/m)?.[1].trim();
                if (!version) throw new Error(`Missing addon version in ${release.tag_name}`);
                if (version === process.env.ADDON_VERSION) {
                  core.setOutput("package", "false");
                  await core.summary.addRaw(
                    `Skipped: main addon ${version} was already included in ${release.tag_name}. ` +
                    "Use manual preview/publish if that version still needs its first CurseForge upload."
                  ).write();
                  return;
                }
              }
            }
            core.setOutput("package", "true");

      - name: Require upload credential when publishing
        if: steps.eligibility.outputs.package == 'true' && (github.event_name == 'release' || inputs.publish)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$CF_API_TOKEN" ]]; then
            echo "::error::Add the CF_API_TOKEN repository Actions secret first."
            exit 1
          fi

      - name: Package main addon only (no upload)
        if: steps.eligibility.outputs.package == 'true'
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_REF: refs/tags/${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          GITHUB_REF_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        with:
          args: >-
            -t .
            -r "${{ github.workspace }}/.curseforge-release"
            -m "${{ runner.temp }}/flocksync-curseforge.pkgmeta"
            -p 1756960
            -n "FlockSync-${{ steps.addon.outputs.version }}:${{ steps.addon.outputs.version }}"
            -d

      - name: Verify archive contents before publishing
        if: steps.eligibility.outputs.package == 'true'
        env:
          ADDON_VERSION: ${{ steps.addon.outputs.version }}
        shell: python
        run: |
          import os
          import pathlib
          import zipfile

          root = pathlib.Path(".curseforge-release")
          archive = root / f"FlockSync-{os.environ['ADDON_VERSION']}.zip"
          with zipfile.ZipFile(archive) as package:
              names = package.namelist()
              assert "FlockSync/FlockSync.toc" in names, "Missing main addon TOC"
              assert all(name.startswith("FlockSync/") for name in names), "Unexpected top-level folder"
              allowed = {path.name for path in pathlib.Path("apps/addon/FlockSync").iterdir() if path.is_file()}
              allowed.add("LICENSE")
              allowed.update(path.name for path in (root / "FlockSync").glob("CHANGELOG*"))
              assert all(name == "FlockSync/" or name.removeprefix("FlockSync/") in allowed for name in names), \
                  "Archive includes unexpected files or nested directories"
              toc = package.read("FlockSync/FlockSync.toc").decode()
              assert f"## Version: {os.environ['ADDON_VERSION']}" in toc, "Incorrect addon version"

      - name: Upload verified archive to CurseForge
        if: steps.eligibility.outputs.package == 'true' && (github.event_name == 'release' || inputs.publish)
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_REF: refs/tags/${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          GITHUB_REF_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        with:
          args: >-
            -t .
            -r "${{ github.workspace }}/.curseforge-release"
            -m "${{ runner.temp }}/flocksync-curseforge.pkgmeta"
            -p 1756960
            -n "FlockSync-${{ steps.addon.outputs.version }}:${{ steps.addon.outputs.version }}"
            -o -c

      - name: Save packaged addon for inspection
        if: steps.eligibility.outputs.package == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FlockSync-CurseForge-${{ steps.addon.outputs.version }}
          path: .curseforge-release/FlockSync-${{ steps.addon.outputs.version }}.zip
          include-hidden-files: true
          if-no-files-found: error
