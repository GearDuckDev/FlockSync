services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_URL: /app/data/flocksync.db
    volumes:
      - ./data/sqlite:/app/data
      - type: bind
        source: ${NAS_BACKUP_PATH:?Set NAS_BACKUP_PATH in .env to an existing backup directory}
        target: /backups
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 30s
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      web:
        condition: service_healthy
  db-backup:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backup
    volumes:
      # SQLite needs writable WAL coordination files even for a read-only connection.
      - ./data/sqlite:/data
      - type: bind
        source: ${NAS_BACKUP_PATH:?Set NAS_BACKUP_PATH in .env to an existing backup directory}
        target: /backups
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
