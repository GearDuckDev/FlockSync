x-bounded-logs: &bounded-logs
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    mem_limit: ${API_MEMORY_LIMIT:-2g}
    memswap_limit: ${API_MEMORY_LIMIT:-2g}
    cpus: ${API_CPU_LIMIT:-2}
    pids_limit: 128
    logging: *bounded-logs
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_URL: /app/data/flocksync.db
      TRUSTED_PROXY_IP: ${API_PROXY_IP:-172.30.90.3}
    networks:
      - api_proxy
      - api_egress
    volumes:
      - ./data/sqlite:/app/data
      - type: bind
        source: ${NAS_BACKUP_PATH:?Set NAS_BACKUP_PATH in .env to an existing backup directory}
        target: /backups
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 30s
  web:
    mem_limit: ${WEB_MEMORY_LIMIT:-256m}
    memswap_limit: ${WEB_MEMORY_LIMIT:-256m}
    cpus: ${WEB_CPU_LIMIT:-1}
    pids_limit: 128
    logging: *bounded-logs
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      TUNNEL_PROXY_IP: ${TUNNEL_PROXY_IP:-172.30.91.3}
    networks:
      api_proxy:
        ipv4_address: ${API_PROXY_IP:-172.30.90.3}
      tunnel_proxy:
        ipv4_address: ${TUNNEL_WEB_IP:-172.30.91.2}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  cloudflared:
    mem_limit: ${TUNNEL_MEMORY_LIMIT:-256m}
    memswap_limit: ${TUNNEL_MEMORY_LIMIT:-256m}
    cpus: ${TUNNEL_CPU_LIMIT:-1}
    pids_limit: 128
    logging: *bounded-logs
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    networks:
      tunnel_proxy:
        ipv4_address: ${TUNNEL_PROXY_IP:-172.30.91.3}
    depends_on:
      web:
        condition: service_healthy
  db-backup:
    mem_limit: ${BACKUP_MEMORY_LIMIT:-512m}
    memswap_limit: ${BACKUP_MEMORY_LIMIT:-512m}
    cpus: ${BACKUP_CPU_LIMIT:-1}
    pids_limit: 64
    logging: *bounded-logs
    environment:
      BACKUP_STORAGE_ID: ${BACKUP_STORAGE_ID:-}
    build:
      context: .
      dockerfile: deploy/Dockerfile.backup
    volumes:
      # SQLite needs writable WAL coordination files even for a read-only connection.
      - ./data/sqlite:/data
      - type: bind
        source: ${NAS_BACKUP_PATH:?Set NAS_BACKUP_PATH in .env to an existing backup directory}
        target: /backups
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
networks:
  api_proxy:
    internal: true
    ipam:
      config:
        - subnet: ${API_PROXY_SUBNET:-172.30.90.0/29}
  api_egress:
  tunnel_proxy:
    ipam:
      config:
        - subnet: ${TUNNEL_PROXY_SUBNET:-172.30.91.0/29}
